server.port=8080

# Twitch IRC — anonymous OAuth token (empty for read-only, or set a valid token for higher rate limits)
twitch.irc.token=

# Emote sources — toggle 7TV and FFZ global emote loading on startup
emote.7tv.enabled=true
emote.ffz.enabled=true

# Telegram notifications — bot token and chat ID for highlight alerts
telegram.bot-token=
telegram.chat-id=

# Spike Detection — sliding window settings
# window-seconds: duration of the message buffer (default 30s)
# threshold-multiplier: rate must exceed baseline * this to trigger spike (default 3.0)
# cooldown-seconds: minimum interval between consecutive spikes (default 30s)
# min-message-count: ignore spikes with fewer messages (default 5)
# min-emote-density: minimum emote-per-message ratio to qualify as spike (default 0.1)
detector.window-seconds=30
detector.threshold-multiplier=3.0
detector.cooldown-seconds=30
detector.min-message-count=5
detector.min-emote-density=0.1

# Highlight Scoring — weights for score calculation
# emote-weight: impact of emote density on score (default 2.0)
# rate-weight: impact of message rate on score (default 1.5)
# subscriber-weight: impact of subscriber message ratio on score (default 1.2)
scoring.emote-weight=2.0
scoring.rate-weight=1.5
scoring.subscriber-weight=1.2

# Logging
logging.level.com.fullonibus=DEBUG
