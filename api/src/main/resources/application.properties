server.port=8080

# Twitch IRC
twitch.irc.token=REDACTED_TWITCH_TOKEN

# Twitch API (for viewer count)
twitch.api.client-id=REDACTED_TWITCH_CLIENT_ID
twitch.api.access-token=REDACTED_TWITCH_TOKEN
twitch.api.refresh-token=REDACTED_TWITCH_REFRESH_TOKEN

# Emote sources
emote.7tv.enabled=true
emote.ffz.enabled=true

# Spike Detection
detector.window-seconds=30
detector.threshold-multiplier=3.0
detector.cooldown-seconds=30
detector.min-message-count=5
detector.min-emote-density=0.1

# Highlight Scoring
scoring.emote-weight=2.0
scoring.rate-weight=1.5
scoring.subscriber-weight=1.2

# Viewer Count Tracking
highlight.viewers.enabled=true
highlight.viewers.poll-interval-seconds=60

# Database
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/twitch_highlights
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=twitch
spring.datasource.password=REDACTED_DB_PASSWORD
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.fullonibus=DEBUG

# Telegram
telegram.bot-token=REDACTED_TELEGRAM_BOT_TOKEN
telegram.chat-id=REDACTED_TELEGRAM_CHAT_ID

# Notifications
notification.enabled=true
notification.enabled-platforms=telegram

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoints.web.base-path=/actuator
management.endpoint.health.show-details=when-authorized
