server.port=8080

# Twitch IRC
twitch.irc.token=

# Emote sources
emote.7tv.enabled=true
emote.ffz.enabled=true

# Spike Detection
detector.window-seconds=30
detector.threshold-multiplier=3.0
detector.cooldown-seconds=30
detector.min-message-count=5
detector.min-emote-density=0.1

# Highlight Scoring
scoring.emote-weight=2.0
scoring.rate-weight=1.5
scoring.subscriber-weight=1.2

# Database
spring.datasource.url=jdbc:h2:file:./data/highlights
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.com.fullonibus=DEBUG
